<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vozodrom Rallye</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Asfalt tokens from src/app/globals.css */
.ph{--bg:#0d0f12;--surface:#15181d;--field:#1b1f25;--ink:#f1f3f5;--muted:#9aa3ad;--line:#262a31;--brand:#2fd0a0;--brand-ink:#05261d;--brand-soft:#123a30;--accent:#ff6a2a;--accent-ink:#160b04;--good:#4ee08f;--warn:#ffb36b;--bad:#ff8a80;--photo:#20252c}
.ph.light{--bg:#f4f6f8;--surface:#ffffff;--field:#eceff3;--ink:#14181d;--muted:#5a6370;--line:#d9dee4;--brand:#0b8466;--brand-ink:#ffffff;--brand-soft:#d9f3ea;--accent:#b83f08;--accent-ink:#ffffff;--good:#17803f;--warn:#995400;--bad:#b42318;--photo:#e3e7ec}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090b;color:#e8ebee;font-family:Barlow,system-ui,sans-serif;padding:32px 24px 64px}
.intro{max-width:1300px;margin:0 auto 28px}
.intro h1{font:700 28px Barlow}
.intro p{font:500 15px/1.5 Barlow;color:#a6aeb7;max-width:760px;margin-top:8px}
.board{display:flex;flex-wrap:wrap;gap:36px 28px;max-width:1300px;margin:0 auto}
figure{width:390px}
figcaption{font:600 14px Barlow;color:#c9cfd5;margin-bottom:10px}
figcaption b{color:#2fd0a0;font-family:"Barlow Condensed";letter-spacing:1px;margin-right:6px}
.ph{width:390px;height:844px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);border-radius:34px;border:1px solid #2a2f36}
.st{height:48px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 8px;font:600 15px Barlow}
.hd{padding:4px 16px 10px}
.hd h2{font:700 30px Barlow;letter-spacing:-.3px}
.hd .sub{font:500 14px Barlow;color:var(--muted);margin-top:2px}
.back{display:flex;align-items:center;gap:10px;padding:6px 12px 8px;font:600 16px Barlow}
.back i{font-style:normal;font-size:22px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;margin-top:10px;overflow:hidden}
.chips a{font:600 14px Barlow;padding:9px 14px;border-radius:20px;background:var(--field);color:var(--muted);white-space:nowrap}
.chips a.on{background:var(--brand);color:var(--brand-ink)}
.seg{display:flex;background:var(--field);border-radius:12px;padding:4px;margin-top:12px}
.seg a{flex:1;text-align:center;font:700 14px Barlow;padding:10px 0;border-radius:9px;color:var(--muted)}
.seg a.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand)}
/* roadbook */
.rb{margin:0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.rh{display:grid;grid-template-columns:var(--c1,92px) 56px 1fr;background:var(--surface);font:700 11px "Barlow Condensed";letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.rh div{padding:10px 12px}
.row{display:grid;grid-template-columns:var(--c1,92px) 56px 1fr;border-top:1px solid var(--line)}
.row .m{padding:14px 12px;font:700 18px/1 "Barlow Condensed";font-variant-numeric:tabular-nums;border-right:1px solid var(--line)}
.row .m small{display:block;font:500 12px Barlow;color:var(--muted);margin-top:6px}
.row .tu{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
.tu svg{width:32px;height:32px;stroke:var(--brand);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.row .n{padding:12px 14px}
.n .k{font:600 12px Barlow;color:var(--muted)}
.n h3{font:600 16px/1.25 Barlow;margin:3px 0 6px}
.n .c{font:700 15px Barlow;color:var(--accent);font-variant-numeric:tabular-nums}
.row.new .m{box-shadow:inset 0 3px 0 var(--brand)}
.row.pend .tu svg{stroke-dasharray:3 3;stroke:var(--warn)}
.row.void{opacity:.82}.row.void h3{text-decoration:line-through}
.stagebar{display:flex;gap:1px;margin:0 12px 10px;background:var(--line);border-radius:8px;overflow:hidden}
.stagebar div{flex:1;background:var(--surface);padding:10px 12px}
.stagebar small{display:block;font:700 11px "Barlow Condensed";letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.stagebar b{font:700 17px "Barlow Condensed";font-variant-numeric:tabular-nums}
/* start number */
.num{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);font:800 20px "Barlow Condensed";border:3px solid var(--brand)}
.photo{background:linear-gradient(150deg,var(--photo),var(--field));position:relative}
.tag{display:inline-block;font:700 11px "Barlow Condensed";letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:4px;background:var(--brand-soft);color:var(--brand)}
.light .tag{color:#07604a}
.note{margin:10px 12px 0;padding:10px 12px;border-radius:8px;border:1px dashed var(--line);font:500 13px/1.4 Barlow;color:var(--muted)}
/* bars */
.fab{position:absolute;right:16px;bottom:104px;height:56px;padding:0 22px;border-radius:28px;background:var(--accent);color:var(--accent-ink);font:700 16px Barlow;display:flex;align-items:center;gap:6px}
.cta{position:absolute;left:0;right:0;bottom:0;padding:12px 12px 30px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}
.btn{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:700 16px Barlow;padding:0 18px}
.btn.p{flex:1;background:var(--accent);color:var(--accent-ink)}
.btn.s{background:var(--field);color:var(--ink);min-width:52px}
.btn.g{flex:1;background:var(--brand);color:var(--brand-ink)}
.btn.d{flex:1;background:var(--field);color:var(--bad)}
nav.tb{position:absolute;left:0;right:0;bottom:0;height:86px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:10px 6px 0}
nav.tb a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px Barlow;color:var(--muted);position:relative}
nav.tb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tb a.on{color:var(--brand)}
.badge{position:absolute;top:-4px;left:54%;background:var(--accent);color:var(--accent-ink);font:700 11px Barlow;border-radius:9px;padding:1px 6px}
.demo{position:absolute;left:16px;font:600 11px Barlow;letter-spacing:1px;color:var(--muted)}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 12px 34px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font:700 20px Barlow;padding:0 6px 10px}
.opt{display:grid;grid-template-columns:56px 1fr 24px;align-items:center;gap:6px;padding:12px 6px;border-top:1px solid var(--line)}
.opt .ic{width:48px;height:48px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center}
.opt .ic svg{width:28px;height:28px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt b{font:600 16px Barlow;display:block}
.opt small{font:500 13px Barlow;color:var(--muted)}
.opt i{font-style:normal;color:var(--muted);font-size:20px}
/* chat */
.msgs{padding:8px 14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:10px 13px;border-radius:16px;font:500 15px/1.35 Barlow}
.b.in{background:var(--field);border-bottom-left-radius:4px}
.b.out{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.b small{display:block;font:500 11px Barlow;opacity:.75;margin-top:4px}
.ctx{margin:0 12px 8px;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px}
.ctx .photo{height:44px;border-radius:8px}
.input{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 30px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px}
.input div{flex:1;height:46px;border-radius:23px;background:var(--field);display:flex;align-items:center;padding:0 16px;color:var(--muted);font:500 15px Barlow}
.input span{width:46px;height:46px;border-radius:23px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font:700 20px Barlow}
.fig{display:flex;justify-content:center;padding:10px 0}
.fig svg{width:220px;height:100px;stroke:var(--ink);fill:none;stroke-width:1.6}
</style></head><body>

  <p>Mobilní aplikace v barvách webu (Asfalt, tyrkys, oranžová). Podpis směru: řádek roadbooku, tedy vlevo kilometry nebo rok, uprostřed značka události, vpravo zápis. Navigace palcem: spodní lišta, hlavní akce v dolní třetině. Všechna data jsou ukázková.</p>

<figure><figcaption><b>06</b>Generace · data STK a registru (světlý motiv)</figcaption>
