name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Served from the root of the custom domain vozodrom.cz, which is set in
      # Settings → Pages (Actions deployments ignore a CNAME file).
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          # GA4 Measurement ID (G-…), set in Settings → Secrets and variables → Actions → Variables.
          # Empty means no analytics and no consent banner.
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
