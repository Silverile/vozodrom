name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds with OpenNext and uploads the worker plus prerendered pages (static assets).
      # Wrangler only uploads assets whose content changed since the last deploy.
      - run: npm run cf:deploy
        env:
          # GA4 Measurement ID of the "vozodrom web" stream. It is public (visible in the page);
          # an empty value means no analytics and no consent banner.
          NEXT_PUBLIC_GA_ID: G-2D6CJ8T7NY
          # Repository secrets: an API token with the "Edit Cloudflare Workers" template and the account ID.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
